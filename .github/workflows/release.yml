name: Release Windows

# Gera o instalador Windows (NSIS .exe + MSI) e publica no GitHub Releases.
#
# Fluxo normal (a versão vem da TAG):
#   git tag v1.2.0 && git push origin v1.2.0      # release estável
#   git tag v1.3.0-1 && git push origin v1.3.0-1  # pré-release (marcada como tal)
#
# Também pode ser disparado manualmente (Actions > Release Windows > Run workflow):
# nesse caso apenas compila e anexa os instaladores como artefato do job, sem criar release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # A TAG é a fonte da verdade da versão: v1.4.2 -> 1.4.2 em package.json,
      # tauri.conf.json (lê do package.json), Cargo.toml e Cargo.lock.
      # Assim basta `git tag v1.4.2 && git push origin v1.4.2`.
      - name: Aplicar versão da tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # MSI (WiX) só aceita X.Y.Z ou X.Y.Z-N (pré-release numérico)
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$ ]]; then
            echo "::error::Tag inválida '$GITHUB_REF_NAME'. Use vX.Y.Z (ex.: v1.2.0) ou vX.Y.Z-N para pré-release (ex.: v1.2.0-1)."
            exit 1
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version --ignore-scripts
          node scripts/sync-version.mjs
          echo "Versão de build: $VERSION"

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: windows-release

      - name: Instalar dependências do frontend
        run: npm ci

      - name: Build + publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "PCP Central ${{ github.ref_name }}"
          releaseBody: |
            Instaladores Windows x64 do PCP Central.

            - **`PCP.Central_*_x64-setup.exe`** — instalador recomendado (NSIS, não exige administrador).
            - **`PCP.Central_*_x64_pt-BR.msi`** — para implantação via GPO/admin.

            O app conta com atualização automática: clientes já instalados identificam esta versão automaticamente via `latest.json`.

            Ao instalar uma versão nova por cima, as configurações (`config.json`) e notas são preservadas.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --target x86_64-pc-windows-msvc

      - name: Build (manual, sem release)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target x86_64-pc-windows-msvc

      - name: Anexar instaladores ao job
        uses: actions/upload-artifact@v4
        with:
          name: pcp-central-windows-x64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

