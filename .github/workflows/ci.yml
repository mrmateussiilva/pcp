name: CI

# Verificação rápida a cada push/PR: build do frontend (tsc + vite) e
# `cargo check` no alvo de produção (Windows), incluindo o código #[cfg(windows)].

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-windows:
    name: Frontend + cargo check (Windows)
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: windows-check

      - name: npm ci
        run: npm ci

      - name: Build do frontend (tsc + vite)
        run: npm run build

      - name: cargo check
        working-directory: src-tauri
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --locked

